name: "Pricing Example Study"
description: "Study to evaluate different pricing strategies"
version: "1.0.0"
authors:
  - "DRT Research Team"
tags:
  - "pricing"
  - "example"

mlflow:
  tracking_uri: "sqlite:///studies/mlflow.db"
  experiment_name: "pricing_study"
  artifact_location: "studies/artifacts/pricing_example"
  tags:
    type: "pricing_evaluation"

execution:
  distributed: false
  max_parallel: 4
  continue_on_error: false
  save_intermediate: true

simulation:
  start_time: "2024-10-24 07:00:00"
  end_time: "2024-10-24 19:00:00"
  warm_up_duration: 1800
  random_seed: 42
  time_step: 1
  time_scale_factor: 1.0
  save_state: true
  save_interval: 3600
  sumo:
    enabled: false

base_config:
  network:
    network_file: "data/networks/hwaseong_drive.graphml"
    walk_network_file: "data/networks/hwaseong_walk.graphml"
    coordinate_system: "EPSG:4326"
    walking_speed: 1.4
    driving_speed: 8.33
  
  demand:
    generator_type: "csv"
    num_requests: 500
    csv_config:
      files:
        - file_path: "data/demands/base_real_time.csv"
          weight: 1.0
      service_area_polygon:
        - [126.827032, 37.198957]
        - [126.822082, 37.203549]
        - [126.818869, 37.206509]
        - [126.817734, 37.209793]
        - [126.832442, 37.216226]
        - [126.833297, 37.209711]
        - [126.836499, 37.210003]
        - [126.838809, 37.206861]
        - [126.844007, 37.201823]
        - [126.828538, 37.198760]
      columns:
        request_time: "time"
        pickup_lat: "o_y"
        pickup_lon: "o_x"
        dropoff_lat: "d_y"
        dropoff_lon: "d_x"
  
  vehicle:
    fleet_size: 5
    capacity: 7
    boarding_time: 7
    alighting_time: 7
    depot_locations:
      - [126.81736515, 37.209416]
      - [126.82221158, 37.20090886]
      - [126.83461236, 37.20602126]
      - [126.8299617, 37.20062122]
      - [126.83069764999999, 37.21154885]

  service:
    max_wait_time: 600
    max_ride_time: 900
    max_walking_distance: 400.0
    max_journey_time: 3600
  
  algorithm:
    routing_algorithm: "dijkstra"
    cost_function: "simple"
    user_acceptance_model: "logit"
    stop_selector: "coverage_based"
    stop_selector_params:
      strategy: "coverage_based"
      max_walking_distance: 500
      min_stop_spacing: 200
      coverage_radius: 400
      min_demand_threshold: 2
      accessibility_weights:
        walk: 0.4
        demand: 0.3
        vehicle: 0.2
        coverage: 0.1
      custom_params:
        max_vehicle_distance: 1500
      candidate_stops_file: "data/candidate_stops/hwaseong.csv"
    stop_assigner: "multi_objective"
    stop_assigner_params:
      strategy: "multi_objective"
      max_alternatives: 3
      thresholds: {"max_walking_distance": 400.0, "max_walking_time": 300.0, "max_driving_time": 900.0}
      weights: {"vehicle_access_time": 0.3, "passenger_access_time": 0.7}

  matching:
    assignment_method: "insertion"
    optimization_method: "none"
    assignment_config:
      constraints:
        max_waiting_time_secs: 600
        max_in_vehicle_time_secs: 900
        max_vehicle_access_time_secs: 600
        max_existing_passenger_delay_secs: 420
        max_distance_meters: 10000.0
      weights:
        passenger_waiting_time: 0.20
        passenger_in_vehicle_time: 0.40
        existing_passenger_delay: 0.30
        distance: 0.10

  user_acceptance:
    max_history_size: 1000
    model:
      type: "logit"
      parameters:
        default_coefficients:
          walking_time_to_origin: -2.0
          walking_time_from_destination: -1.5
          waiting_time: -2.5
          in_vehicle_time: -1.5
          cost: -2.0
        max_training_samples: 2000
        logistic_params:
          solver: "lbfgs"
          max_iter: 1000
          class_weight: "balanced"
    enable_user_specific_models: true
  
  pricing:
    model_type: "simple"
    model_params:
      flat_fare: 1350.0
      enable_distance_pricing: false
      per_km_rate: 350.0
      min_price: 1350.0
      max_price: 1850.0
    currency: "KRW"
    currency_symbol: "₩"
    default_price: 1350.0
    price_update_interval: 300

parameter_sets:
  simple_pricing_krw:
    name: "Simple Pricing (KRW)"
    description: "Basic flat rate pricing in Korean Won"
    pricing:
      model_type: "simple"
      model_params:
        flat_fare: 1350.0
        enable_distance_pricing: false
        per_km_rate: 350.0
        min_price: 1350.0
        max_price: 1850.0
      currency: "KRW"
      currency_symbol: "₩"
      default_price: 1350.0
      price_update_interval: 300
    replications: 1
  